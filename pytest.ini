[pytest]
# Preserve pytest's normal exclusions; generated fixture output is not source.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} test-output history-archive

# Repository tools are imported by source-evidence tests even when pytest runs
# from cad_photo_to_dxf (the CI working directory). Do not depend on cwd.
pythonpath = . cad_photo_to_dxf
