name: P1B stage2 path unification
on:
  pull_request:
    branches: [fix/non-destructive-editable-text]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/p1b-unify-text-paths-stage2'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1b-unify-text-paths-stage2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Apply path unification
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('cad_photo_to_dxf/app/trace_dxf_entities.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from math import atan2, degrees, hypot\nfrom unicodedata import east_asian_width\n','from math import hypot\n')
          anchor='from .line_detect import LineSegment\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'from .ocr_outline_export import add_ocr_outline_blocks\n')
          start=s.index('\ndef _candidate_quad(')
          replacement='''\n\ndef add_ocr_text_entities(\n    layout,\n    texts: Sequence[TextCandidate],\n    *,\n    transform: PointTransform,\n    layer_name: str = "OCR_TEXT",\n    style_name: str = "OCR_CJK",\n    minimum_confidence: float = 0.58,\n) -> tuple[int, list[object], list[tuple[float, float]]]:\n    """Compatibility entry point delegated to canonical fit-to-quad geometry."""\n\n    del style_name\n    return add_ocr_outline_blocks(\n        layout.doc,\n        layout,\n        texts,\n        transform=transform,\n        layer_name=layer_name,\n        minimum_confidence=minimum_confidence,\n    )\n'''
          s=s[:start]+replacement
          p.write_text(s,encoding='utf-8')

          p=Path('cad_photo_to_dxf/app/dxf_exporter.py')
          s=p.read_text(encoding='utf-8')
          anchor='from .line_detect import LineSegment\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'from .ocr_outline_export import add_ocr_outline_blocks\n')
          start=s.index('    requested_texts = list(texts or [])\n')
          end=s.index('    requested_trace_paths = tuple(trace_paths or ())\n',start)
          replacement='''    requested_texts = list(texts or [])\n    valid_texts = filter_exportable_texts(requested_texts)\n\n    def text_transform(x: float, y: float) -> tuple[float, float]:\n        return (x * scale, (image_height - 1 - y) * scale)\n\n    text_count, _text_entities, text_bounds = add_ocr_outline_blocks(\n        doc,\n        modelspace,\n        valid_texts,\n        transform=text_transform,\n        layer_name="OCR_TEXT",\n        minimum_confidence=MIN_TEXT_EXPORT_CONFIDENCE,\n    )\n    coordinates.extend(text_bounds)\n\n'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('        text_count=len(valid_texts),\n','        text_count=text_count,\n')
          p.write_text(s,encoding='utf-8')

          Path('cad_photo_to_dxf/tests/test_text_geometry_path_unification.py').write_text('''from __future__ import annotations\n\nfrom math import isclose\n\nimport ezdxf\n\nfrom app.auxiliary_recognition import TextCandidate\nfrom app.ocr_outline_export import add_ocr_outline_blocks\nfrom app.trace_dxf_entities import add_ocr_text_entities\n\n\ndef _candidate() -> TextCandidate:\n    return TextCandidate(\n        text="中文 ABC 7600",\n        bbox=(10, 20, 120, 24),\n        confidence=0.99,\n        kind="text_candidate",\n        quad=((10.0, 20.0), (130.0, 20.0), (130.0, 44.0), (10.0, 44.0)),\n        source="path-unification-test",\n        approved=True,\n        reviewed=True,\n        replacement_safe=True,\n    )\n\n\ndef _summary(entity) -> tuple[object, ...]:\n    return (\n        entity.dxftype(),\n        entity.dxf.text,\n        float(entity.dxf.height),\n        float(entity.dxf.width),\n        float(entity.dxf.rotation),\n        tuple(float(value) for value in entity.dxf.insert[:2]),\n    )\n\n\ndef test_legacy_trace_entry_delegates_to_canonical_geometry() -> None:\n    candidate=_candidate()\n    transform=lambda x,y:(x,200.0-y)\n    canonical=ezdxf.new("R2010",setup=True)\n    legacy=ezdxf.new("R2010",setup=True)\n    c_count,c_entities,_=add_ocr_outline_blocks(\n        canonical,canonical.modelspace(),(candidate,),transform=transform,minimum_confidence=0.58\n    )\n    l_count,l_entities,_=add_ocr_text_entities(\n        legacy.modelspace(),(candidate,),transform=transform,minimum_confidence=0.58\n    )\n    assert c_count == l_count == 1\n    c=_summary(c_entities[0])\n    l=_summary(l_entities[0])\n    assert c[:2] == l[:2]\n    for left,right in zip(c[2:5],l[2:5],strict=True):\n        assert isclose(left,right,rel_tol=1e-12,abs_tol=1e-12)\n    assert c[5] == l[5]\n    assert not canonical.audit().errors\n    assert not legacy.audit().errors\n\n\ndef test_legacy_module_has_no_independent_height_formula() -> None:\n    from pathlib import Path\n    source=Path('app/trace_dxf_entities.py').read_text(encoding='utf-8')\n    assert 'target_height * 0.82' not in source\n    assert '_text_width_units' not in source\n''',encoding='utf-8')

          Path('cad_photo_to_dxf/validation/text-geometry-fit').mkdir(parents=True,exist_ok=True)
          Path('cad_photo_to_dxf/validation/text-geometry-fit/path-unification.md').write_text('''# Native TEXT path unification\n\n- Canonical implementation: `ocr_outline_export.add_ocr_outline_blocks`.\n- Current single-page export delegates directly to canonical geometry.\n- Current document/batch export delegates directly to canonical geometry.\n- Legacy `trace_dxf_entities.add_ocr_text_entities` is retained as a compatibility entry point and delegates to canonical geometry.\n- Legacy `dxf_exporter.export_dxf` delegates its text segment to canonical geometry.\n- Independent reachable `0.82` and `0.85` text-height formulas are no longer used.\n''',encoding='utf-8')

          Path('docs/project/CHECKPOINT.md').write_text('''# Project checkpoint\n\nRecorded: 2026-07-31\n\n- Branch: `fix/non-destructive-editable-text`\n- P1B start: `5f7846e00b41913c003f178558a110e6475c0ee0`\n- P1B-1 commit: `434209f0ef0e405726cfd6d733d62c7ae0ce8f17`\n- Phase-12 baseline tag remains untouched.\n\n## P1B-2\n\nAll reachable native TEXT creation entry points now delegate to `ocr_outline_export.add_ocr_outline_blocks`. The legacy trace compatibility function no longer owns an independent 0.82 height/heuristic-width implementation. The generic DXF exporter no longer owns an independent 0.85 bbox-height implementation. Focused tests compare entity type, content, height, width factor, rotation, and insertion.\n\n## Next safe operation\n\nRun P1B-3 full validation and produce the per-page/manual-UAT package. Do not begin P2.\n''',encoding='utf-8')
          PY
          rm -f .github/workflows/p1b-stage2-pr.yml
      - name: Install and test
        working-directory: cad_photo_to_dxf
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pytest -q tests/test_native_text_geometry.py tests/test_font_aware_ocr_export.py tests/test_text_geometry_path_unification.py tests/test_trace_export.py
          python -m ruff check app/ocr_outline_export.py app/trace_dxf_entities.py app/dxf_exporter.py tests/test_text_geometry_path_unification.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: unify native text geometry export paths'
          git push origin HEAD:agent/p1b-unify-text-paths-stage2
