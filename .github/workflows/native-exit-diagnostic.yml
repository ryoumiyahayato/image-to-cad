name: PR34 native exit isolation (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-exit-diagnostic.yml
      - maintenance/native_exit_diagnostic.py

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [imports, pdf, ocr, qt, processing]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt
      - name: Install existing runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -r cad_photo_to_dxf/requirements.txt -r cad_photo_to_dxf/requirements-test.txt
      - name: Run isolated process and retain its real exit status
        run: python -X dev -X faulthandler maintenance/native_exit_diagnostic.py ${{ matrix.group }}
