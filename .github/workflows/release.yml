name: Product release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches the application version
        working-directory: cad_photo_to_dxf
        run: |
          python - <<'PY'
          import os
          from app import __version__
          if os.environ['GITHUB_REF_NAME'] != f'v{__version__}':
              raise SystemExit('Tag does not match the application version')
          PY
  windows:
    needs: qualify
    uses: ./.github/workflows/windows-build.yml
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CADPhotoToDXF-Windows-*
          path: delivery
          merge-multiple: true
      - name: Publish the tested portable ZIP and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" delivery/* --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-dev* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
