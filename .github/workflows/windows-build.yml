name: Windows product build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, development/product-core-reset]
    paths: ['cad_photo_to_dxf/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['cad_photo_to_dxf/**', '.github/workflows/windows-build.yml']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: cad_photo_to_dxf
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt
      - name: Install product and build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read application version
        id: version
        run: |
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Cannot read application version" }
          "value=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare redistributable font and offline bilingual OCR
        run: |
          python scripts/prepare_cad_fonts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_ocr_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check product code and PowerShell entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check app tests scripts main.py ../tools/native_first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests ../tools/native_first/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q app scripts main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @("windows_smoke.ps1", "installer_smoke.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/$script"), [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build complete portable application
        env:
          CADPHOTO_SKIP_FONT_DOWNLOAD: '1'
          CADPHOTO_SKIP_MODEL_DOWNLOAD: '1'
        run: |
          python -m PyInstaller --noconfirm --clean cad_photo_to_dxf.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/portable_delivery.py --source-dir dist/CADPhotoToDXF --output-dir delivery --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unzip and run the actual portable EXE
        run: |
          $restored = Join-Path $env:RUNNER_TEMP "cad-product-restored"
          Expand-Archive -LiteralPath "delivery/CADPhotoToDXF-$env:VERSION-Windows-Portable.zip" -DestinationPath $restored -Force
          ./scripts/windows_smoke.ps1 `
            -Executable "$restored/CADPhotoToDXF/CADPhotoToDXF.exe" `
            -WorkingDirectory "$env:RUNNER_TEMP/cad-product-portable-smoke" `
            -ExpectedVersion $env:VERSION
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: |
          $fileVersion = (python -c "from app import __version__; from scripts.versioning import parse_version; print('.'.join(map(str, parse_version(__version__))))").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DMyAppFileVersion=$fileVersion" installer/cad_photo_to_dxf.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
      - name: Install, convert, launch desktop and uninstall
        run: |
          ./scripts/installer_smoke.ps1 `
            -Installer "installer/output/CADPhotoToDXF-$env:VERSION-Setup.exe" `
            -WorkingDirectory "$env:RUNNER_TEMP/cad-product-installer-smoke" `
            -ExpectedVersion $env:VERSION
          Copy-Item "installer/output/CADPhotoToDXF-$env:VERSION-Setup.exe" delivery/
          $setup = Get-Item "delivery/CADPhotoToDXF-$env:VERSION-Setup.exe"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash.ToLowerInvariant()
          "$digest  $($setup.Name)" | Set-Content -LiteralPath "$($setup.FullName).sha256" -Encoding ascii
      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CADPhotoToDXF-Windows-${{ steps.version.outputs.value }}
          if-no-files-found: error
          compression-level: 0
          path: cad_photo_to_dxf/delivery/*
      - name: Save actual EXE conversion and install results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-product-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cad-product-portable-smoke/**
            ${{ runner.temp }}/cad-product-installer-smoke/run/**
            ${{ runner.temp }}/cad-product-installer-smoke/installer-smoke.json
