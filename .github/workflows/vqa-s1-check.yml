name: VQA-S1 focused check

on:
  push:
    branches:
      - "fix/vqa-s1-check"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    defaults:
      run:
        working-directory: cad_photo_to_dxf

    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run VQA-S1 tests
        run: python -m pytest -q tests/test_visual_acceptance.py
      - name: Run VQA-S1 Ruff checks
        run: python -m ruff check app/visual_acceptance.py app/gui_public_release.py tests/test_visual_acceptance.py
      - name: Compile VQA-S1 sources
        run: python -m compileall -q app/visual_acceptance.py app/gui_public_release.py tests/test_visual_acceptance.py
