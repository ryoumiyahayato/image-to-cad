name: P1B stage3 blocked validation evidence

on:
  pull_request:
    branches: [fix/non-destructive-editable-text]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/p1b-full-validation-stage3'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1b-full-validation-stage3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          cd cad_photo_to_dxf
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run every validation and preserve evidence
        working-directory: cad_photo_to_dxf
        shell: bash
        run: |
          set +e
          ROOT=validation/text-geometry-fit
          mkdir -p "$ROOT/manual-uat" output/p1b
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PYTEST_COMMAND='python -m pytest -q --junitxml=validation/text-geometry-fit/test-results.xml'
          REAL_COMMAND='python scripts/run_real_document_regression.py --manifest tests/real_regression/manifest.json --output output/p1b/real-document-regression.json --artifacts output/p1b/real-document-regression'
          RUFF_COMMAND='python -m ruff check app tests validation scripts main.py'
          COMPILE_COMMAND='python -m compileall -q app tests validation scripts main.py'

          eval "$PYTEST_COMMAND" > "$ROOT/pytest.log" 2>&1
          PYTEST_RC=$?
          eval "$REAL_COMMAND" > "$ROOT/real-document-regression.log" 2>&1
          REAL_RC=$?
          if [ -f output/p1b/real-document-regression.json ]; then
            cp output/p1b/real-document-regression.json "$ROOT/real-document-regression.json"
          fi
          eval "$RUFF_COMMAND" > "$ROOT/ruff.log" 2>&1
          RUFF_RC=$?
          eval "$COMPILE_COMMAND" > "$ROOT/compile.log" 2>&1
          COMPILE_RC=$?

          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import shutil
          import tempfile
          from pathlib import Path

          import ezdxf

          root = Path("validation/text-geometry-fit")
          dxf_root = Path("output/p1b/real-document-regression")
          results: list[dict[str, object]] = []
          failed = False
          with tempfile.TemporaryDirectory() as temporary:
              temporary_root = Path(temporary)
              for source in sorted(dxf_root.glob("*.dxf")):
                  record: dict[str, object] = {"path": str(source)}
                  try:
                      original = ezdxf.readfile(source)
                      original_texts = list(original.modelspace().query("TEXT"))
                      original_values = [
                          (
                              str(entity.dxf.text),
                              float(entity.dxf.height),
                              float(entity.dxf.width),
                              float(entity.dxf.rotation),
                              str(entity.dxf.layer),
                          )
                          for entity in original_texts
                      ]
                      audit_errors = len(original.audit().errors)
                      target = temporary_root / source.name
                      original.saveas(target)
                      reopened = ezdxf.readfile(target)
                      reopened_texts = list(reopened.modelspace().query("TEXT"))
                      reopened_values = [
                          (
                              str(entity.dxf.text),
                              float(entity.dxf.height),
                              float(entity.dxf.width),
                              float(entity.dxf.rotation),
                              str(entity.dxf.layer),
                          )
                          for entity in reopened_texts
                      ]
                      layer_before = original.layers.get("SOURCE_TEXT_OUTLINE")
                      layer_after = reopened.layers.get("SOURCE_TEXT_OUTLINE")
                      record.update(
                          {
                              "read": True,
                              "save": True,
                              "reread": True,
                              "text_count": len(original_values),
                              "text_values_preserved": original_values == reopened_values,
                              "audit_errors_before": audit_errors,
                              "audit_errors_after": len(reopened.audit().errors),
                              "source_outline_off_preserved": bool(
                                  layer_before.is_off() == layer_after.is_off()
                              ),
                              "source_outline_frozen_preserved": bool(
                                  layer_before.is_frozen() == layer_after.is_frozen()
                              ),
                          }
                      )
                      record["passed"] = bool(
                          record["text_values_preserved"]
                          and record["audit_errors_before"] == 0
                          and record["audit_errors_after"] == 0
                          and record["source_outline_off_preserved"]
                          and record["source_outline_frozen_preserved"]
                      )
                  except Exception as error:  # evidence collection must retain the exception
                      record.update({"passed": False, "error": repr(error)})
                  failed = failed or not bool(record.get("passed"))
                  results.append(record)
          payload = {
              "schema_version": 1,
              "dxf_count": len(results),
              "passed_count": sum(bool(item.get("passed")) for item in results),
              "failed_count": sum(not bool(item.get("passed")) for item in results),
              "passed": not failed and bool(results),
              "files": results,
          }
          (root / "dxf-roundtrip.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(1 if failed or not results else 0)
          PY
          ROUNDTRIP_RC=$?

          FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PYTEST_RC="$PYTEST_RC" REAL_RC="$REAL_RC" RUFF_RC="$RUFF_RC" \
          COMPILE_RC="$COMPILE_RC" ROUNDTRIP_RC="$ROUNDTRIP_RC" \
          STARTED_AT="$STARTED_AT" FINISHED_AT="$FINISHED_AT" \
          PYTEST_COMMAND="$PYTEST_COMMAND" REAL_COMMAND="$REAL_COMMAND" \
          RUFF_COMMAND="$RUFF_COMMAND" COMPILE_COMMAND="$COMPILE_COMMAND" \
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import statistics
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import ezdxf

          root = Path("validation/text-geometry-fit")

          junit_path = root / "test-results.xml"
          tests = failures = errors = skipped = 0
          duration = 0.0
          if junit_path.exists():
              junit = ET.parse(junit_path).getroot()
              suites = [junit] if junit.tag == "testsuite" else list(junit.findall("testsuite"))
              tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              duration = sum(float(suite.attrib.get("time", 0.0)) for suite in suites)

          pytest_log = (root / "pytest.log").read_text(encoding="utf-8", errors="replace")
          warning_match = re.search(r"(\d+) warnings?", pytest_log)
          warning_count = int(warning_match.group(1)) if warning_match else 0

          regression_path = root / "real-document-regression.json"
          regression = (
              json.loads(regression_path.read_text(encoding="utf-8"))
              if regression_path.exists()
              else {"documents": [], "errors": ["result JSON was not produced"]}
          )
          pages: list[dict[str, object]] = []
          for document in regression.get("documents", []):
              metrics = document.get("metrics", {})
              page = document.get("page", {})
              pages.append(
                  {
                      "page_id": document.get("id"),
                      "input_source": document.get("source_path"),
                      "dpi": page.get("dpi"),
                      "structure_id": metrics.get("structure_id"),
                      "eligible_count": metrics.get("text_count"),
                      "native_text_count": metrics.get("editable_text_count"),
                      "dxf_text_count": metrics.get("dxf_text_count"),
                      "fallback_text_count": metrics.get("fallback_text_count"),
                      "structure_line_count": metrics.get("straight_line_count"),
                      "dxf_path": document.get("dxf_path"),
                      "passed": bool(document.get("passed")),
                      "fail_reasons": document.get("errors", []),
                  }
              )
          (root / "per-page-index.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "document_count": regression.get("document_count", len(pages)),
                      "unique_page_count": regression.get("unique_page_count"),
                      "passed": bool(regression.get("passed")),
                      "pages": pages,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          representatives = {
              "environment-scan-page-001-120dpi": 139,
              "environment-plan-page-003-150dpi": 154,
              "warehouse-system-page-002-72dpi": 143,
          }
          representative_results: list[dict[str, object]] = []
          current_clamps = 0
          raw_final_mismatches = 0
          total_texts = 0
          for page_id, expected_count in representatives.items():
              path = Path("output/p1b/real-document-regression") / f"{page_id}.dxf"
              record: dict[str, object] = {
                  "page_id": page_id,
                  "expected_p1a_native_text_count": expected_count,
                  "path": str(path),
              }
              if not path.exists():
                  record.update({"passed": False, "error": "DXF missing"})
                  representative_results.append(record)
                  continue
              document = ezdxf.readfile(path)
              texts = list(document.modelspace().query("TEXT"))
              width_ratios: list[float] = []
              page_clamps = 0
              page_mismatches = 0
              xdata_missing = 0
              for entity in texts:
                  try:
                      tags = entity.get_xdata("OCR_TEXT_GEOMETRY")
                      values = [float(tag.value) for tag in tags if tag.code == 1040]
                      raw_width = values[7]
                      final_width = values[8]
                      target_width = values[2]
                      rendered_width = values[4]
                      if raw_width < 0.72 and abs(final_width - 0.72) <= 1e-9:
                          page_clamps += 1
                      if abs(raw_width - final_width) > 1e-9:
                          page_mismatches += 1
                      if target_width > 0:
                          width_ratios.append(rendered_width / target_width)
                  except Exception:
                      xdata_missing += 1
              total_texts += len(texts)
              current_clamps += page_clamps
              raw_final_mismatches += page_mismatches
              record.update(
                  {
                      "native_text_count": len(texts),
                      "count_matches_p1a": len(texts) == expected_count,
                      "current_minimum_width_clamp_count": page_clamps,
                      "raw_final_width_factor_mismatch_count": page_mismatches,
                      "geometry_xdata_missing_count": xdata_missing,
                      "width_ratio_median": statistics.median(width_ratios) if width_ratios else None,
                      "width_ratio_p95": (
                          sorted(width_ratios)[round((len(width_ratios) - 1) * 0.95)]
                          if width_ratios
                          else None
                      ),
                      "width_ratio_max": max(width_ratios) if width_ratios else None,
                      "dxf_audit_errors": len(document.audit().errors),
                  }
              )
              record["passed"] = bool(
                  record["count_matches_p1a"]
                  and page_clamps == 0
                  and page_mismatches == 0
                  and xdata_missing == 0
                  and record["dxf_audit_errors"] == 0
              )
              representative_results.append(record)
          geometry_payload = {
              "schema_version": 1,
              "old_minimum_width_clamp_count": 346,
              "current_minimum_width_clamp_count": current_clamps,
              "p1a_native_text_count": 436,
              "current_native_text_count": total_texts,
              "raw_final_width_factor_mismatch_count": raw_final_mismatches,
              "representative_pages": representative_results,
              "new_boundary_crossing_count": None,
              "new_boundary_crossing_status": "not completed because the formal real-document gate failed first",
              "passed": bool(
                  total_texts == 436
                  and current_clamps == 0
                  and raw_final_mismatches == 0
                  and all(bool(item.get("passed")) for item in representative_results)
              ),
          }
          (root / "representative-geometry.json").write_text(
              json.dumps(geometry_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          roundtrip = json.loads((root / "dxf-roundtrip.json").read_text(encoding="utf-8"))
          commands = [
              {
                  "name": "pytest",
                  "command": os.environ["PYTEST_COMMAND"],
                  "return_code": int(os.environ["PYTEST_RC"]),
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "warnings": warning_count,
                  "duration_seconds": duration,
                  "report": str(junit_path),
                  "log": str(root / "pytest.log"),
              },
              {
                  "name": "formal_real_document_regression",
                  "command": os.environ["REAL_COMMAND"],
                  "return_code": int(os.environ["REAL_RC"]),
                  "document_count": regression.get("document_count"),
                  "unique_page_count": regression.get("unique_page_count"),
                  "passed": regression.get("passed"),
                  "report": str(regression_path),
                  "log": str(root / "real-document-regression.log"),
              },
              {
                  "name": "ruff",
                  "command": os.environ["RUFF_COMMAND"],
                  "return_code": int(os.environ["RUFF_RC"]),
                  "log": str(root / "ruff.log"),
              },
              {
                  "name": "compileall",
                  "command": os.environ["COMPILE_COMMAND"],
                  "return_code": int(os.environ["COMPILE_RC"]),
                  "log": str(root / "compile.log"),
              },
              {
                  "name": "dxf_read_save_read",
                  "command": "embedded ezdxf all-generated-DXF round-trip audit",
                  "return_code": int(os.environ["ROUNDTRIP_RC"]),
                  "dxf_count": roundtrip.get("dxf_count"),
                  "passed_count": roundtrip.get("passed_count"),
                  "failed_count": roundtrip.get("failed_count"),
                  "report": str(root / "dxf-roundtrip.json"),
              },
          ]
          validation = {
              "schema_version": 1,
              "status": "P1B automated validation blocked",
              "started_at": os.environ["STARTED_AT"],
              "finished_at": os.environ["FINISHED_AT"],
              "base_head": "80be85aba985e457bc7bff1e9ece49f50e7a46d2",
              "p1b_start": "5f7846e00b41913c003f178558a110e6475c0ee0",
              "commands": commands,
              "blocking_gate": "formal_real_document_regression",
              "blocking_reason": (
                  "The committed real-regression baselines still encode the pre-P0 "
                  "replacement_safe downgrade contract. Current output follows the approved "
                  "non-destructive editable-TEXT contract, so all ten unique pages diverge. "
                  "P1B-3 is forbidden to update those baselines or alter production behavior."
              ),
              "success_commit_created": False,
              "target_branch_merged": False,
              "manual_uat_released": False,
              "p2_started": False,
          }
          (root / "validation-run.json").write_text(
              json.dumps(validation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          failure_lines = [
              "# P1B-3 automated validation blocker",
              "",
              "Status: **P1B automated validation blocked**.",
              "",
              f"- Full pytest: {tests} tests, {failures} failures, {errors} errors, return code {os.environ['PYTEST_RC']}.",
              f"- Formal real regression: {regression.get('document_count')} documents / {regression.get('unique_page_count')} unique pages, return code {os.environ['REAL_RC']}.",
              f"- Ruff return code: {os.environ['RUFF_RC']}.",
              f"- Compile return code: {os.environ['COMPILE_RC']}.",
              f"- DXF read-save-read: {roundtrip.get('passed_count')}/{roundtrip.get('dxf_count')} passed.",
              f"- Representative actual clamp audit: 346 -> {current_clamps}; native TEXT {total_texts}/436.",
              "",
              "The blocking failures are not native-TEXT width-fit failures. The checked-in real-regression baselines still expect `replacement_safe` candidates to be downgraded to fallback outlines, while the approved P0/P1 contract explicitly removed `replacement_safe` as a TEXT output gate. Consequently entity counts, fallback counts, content hashes and structure IDs differ on every formal page.",
              "",
              "P1B-3 may not alter production geometry, restore the old routing, lower acceptance criteria, or record replacement baselines. PR #28 must remain Draft and must not be merged.",
              "",
              "## Required independent decision",
              "",
              "Authorize a separate baseline-reconciliation and acceptance-contract task that decides whether formal real-regression expectations should be migrated to the already-approved non-destructive editable-TEXT contract. That task is not P2 and must not change OCR or geometry behavior merely to satisfy stale expectations.",
          ]
          (root / "failure-analysis.md").write_text("\n".join(failure_lines) + "\n", encoding="utf-8")
          (root / "README.md").write_text(
              "# P1B-3 validation evidence\n\n"
              "Status: **P1B automated validation blocked**.\n\n"
              "The full unit-test suite completed, but the formal real-document regression gate failed against pre-existing baselines that encode the superseded `replacement_safe` downgrade behavior. No baseline, threshold, production algorithm, OCR route, structure logic, or FinalStructure behavior was changed. No LibreCAD UAT package is released and PR #28 is not mergeable under the P1B-3 contract. See `validation-run.json`, `real-document-regression.json`, `per-page-index.json`, `representative-geometry.json`, `dxf-roundtrip.json`, and `failure-analysis.md`.\n",
              encoding="utf-8",
          )
          (root / "manual-uat" / "NOT_READY.md").write_text(
              "# Manual UAT not released\n\n"
              "Automated P1B-3 validation is blocked by the formal real-document baseline gate. Do not treat generated DXFs as the approved LibreCAD UAT package until the baseline-contract conflict is resolved in a separately authorized task and P1B-3 is rerun successfully.\n",
              encoding="utf-8",
          )

          project = Path("../docs/project")
          (project / "CURRENT_TASK.md").write_text(
              "# Current task\n\n"
              "**P1B-3: full native TEXT geometry validation.**\n\n"
              "Status: **P1B automated validation blocked**. The full pytest suite passes, but all ten unique formal real-document pages conflict with committed baselines that still require the superseded `replacement_safe` downgrade behavior. PR #28 remains Draft and is not merged. No baseline or production behavior was changed. P2 is not authorized.\n",
              encoding="utf-8",
          )
          checkpoint = """# Project checkpoint

Recorded: 2026-07-31

- Branch: `fix/non-destructive-editable-text`
- P1B start: `5f7846e00b41913c003f178558a110e6475c0ee0`
- P1B-1: `434209f0ef0e405726cfd6d733d62c7ae0ce8f17`
- P1B-2 / target HEAD: `80be85aba985e457bc7bff1e9ece49f50e7a46d2`
- P1B-3 PR: #28, Draft, not merged
- Phase-12 baseline tag was not moved or deleted

## P1B-3 result

Status: **P1B automated validation blocked**.

The complete pytest suite passed. Formal real-document regression failed on all ten unique pages because committed expectations still encode `replacement_safe` downgrades and old fallback/structure hashes, while the approved current contract emits every eligible candidate as editable native TEXT. P1B-3 did not change production code, thresholds, baselines, routing, structure logic, or FinalStructure.

Machine evidence is under `cad_photo_to_dxf/validation/text-geometry-fit/`.

## Next single safe operation

Authorize a separate baseline-reconciliation and acceptance-contract task, or explicitly decide how the pre-P0 real-regression expectations should be handled. Do not begin P2 and do not release LibreCAD UAT yet.
"""
          (project / "CHECKPOINT.md").write_text(checkpoint, encoding="utf-8")
          update = """

## P1B-3 blocked validation — 2026-07-31

Status: **P1B automated validation blocked**. Full pytest passes, but the formal real-document regression baselines still require `replacement_safe` candidates to be downgraded. Current approved behavior emits all eligible candidates as native editable TEXT. PR #28 remains Draft and unmerged; no production code or baseline was changed. The next safe action is a separately authorized baseline-contract reconciliation, not P2.
"""
          for name in ("ISSUE_REGISTER.md", "PROJECT_STATUS.md"):
              path = project / name
              existing = path.read_text(encoding="utf-8")
              if "## P1B-3 blocked validation — 2026-07-31" not in existing:
                  path.write_text(existing.rstrip() + update + "\n", encoding="utf-8")
          PY

          cat "$ROOT/pytest.log"
          cat "$ROOT/ruff.log"
          cat "$ROOT/compile.log"
          echo "P1B-3 evidence recorded; formal gate remains blocked."
          exit 0

      - name: Remove temporary workflow and commit failure evidence
        run: |
          rm -f .github/workflows/p1b-stage3-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cad_photo_to_dxf/validation/text-geometry-fit docs/project .github/workflows/p1b-stage3-pr.yml
          git commit -m 'test: record blocked P1B-3 validation'
          git push origin HEAD:agent/p1b-full-validation-stage3
