name: Native-first preparation (read-only)
on:
  push:
    branches: [maintenance/native-first-20261024]
    paths: [.github/workflows/native-first-prepare.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot main and inventory all branch tips
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/native-first-preparation
          python - <<'PY'
          import json, subprocess, pathlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'b7ba356182701d21a0ae9c71acc5c74b4e8c4763'
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('main changed; inspect before continuation')
          rows = []
          for line in git('for-each-ref', '--format=%(refname:short) %(objectname)', 'refs/remotes/origin').splitlines():
              ref, sha = line.split()
              if ref == 'origin/HEAD':
                  continue
              ahead = int(git('rev-list', '--count', base + '..' + sha))
              behind = int(git('rev-list', '--count', sha + '..' + base))
              row = {'branch': ref.removeprefix('origin/'), 'sha': sha, 'ahead_of_main': ahead, 'behind_main': behind}
              rows.append(row)
          root = pathlib.Path('/tmp/native-first-preparation')
          (root/'branch-inventory.json').write_text(json.dumps({'base':base,'branches':rows}, indent=2)+'\n')
          subprocess.run(['git','archive','--format=zip','--output='+str(root/'main-source.zip'),base],check=True)
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-first-preparation
          path: /tmp/native-first-preparation/
          retention-days: 7
