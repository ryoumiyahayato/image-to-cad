name: Product checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cad_photo_to_dxf
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt
      - name: Install Qt offscreen system runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install product and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Prepare CJK font and offline OCR models
        run: |
          python scripts/prepare_cad_fonts.py
          python scripts/prepare_ocr_models.py
      - name: Check retained core behavior
        run: |
          python -m ruff check app tests scripts main.py ../tools/native_first
          python -m compileall -q app scripts main.py
          python -m pytest tests ../tools/native_first/tests -q
      - name: Convert ordinary scans and native PDF through the public CLI
        run: python scripts/product_smoke.py --source-main main.py --work "${{ runner.temp }}/product-source-smoke"
      - name: Save actual inputs, DXFs, previews and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Product-source-smoke-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/product-source-smoke/**
