name: Product checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cad_photo_to_dxf
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce read-only lock on core governance docs
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'allow-governance-edit')
        working-directory: ${{ github.workspace }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          LOCKED_PATTERN='^(AGENTS\.md|README\.md|cad_photo_to_dxf/README\.md|docs/project/(PRODUCT_INTENT_AND_KNOWLEDGE_PACKS_ZH|ARCHITECTURE_AND_ROADMAP_ZH|AGENT_OPERATING_PROTOCOL|ACCEPTANCE_GATES)\.md|\.github/CODEOWNERS|\.github/workflows/ci\.yml)$'
          VIOLATIONS=$(printf '%s\n' "$CHANGED" | grep -E "$LOCKED_PATTERN" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "拒绝合并：以下核心产品宪章、三层架构规范或 CI 守卫文件已锁定只读，禁止 PR 未经授权修改："
            printf '%s\n' "$VIOLATIONS"
            echo "如需修改，必须取得仓库所有者当轮明确授权并由所有者为 PR 添加 allow-governance-edit 标签。"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cad_photo_to_dxf/requirements*.txt
      - name: Install Qt offscreen system runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install product and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Prepare CJK font and offline OCR models
        run: |
          python scripts/prepare_cad_fonts.py
          python scripts/prepare_ocr_models.py
      - name: Check retained core behavior
        run: |
          python -m ruff check app tests scripts main.py ../tools/native_first
          python -m compileall -q app scripts main.py
          python -m pytest tests ../tools/native_first/tests -q
      - name: Convert ordinary scans and native PDF through the public CLI
        run: python scripts/product_smoke.py --source-main main.py --work "${{ runner.temp }}/product-source-smoke"
      - name: Save actual inputs, DXFs, previews and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Product-source-smoke-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/product-source-smoke/**
