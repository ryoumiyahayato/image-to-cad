name: Import verified r13 source delta
on:
  push:
    branches: [sync/verified-online-r12-20261116]
    paths: [.github/workflows/import-verified-r13.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'chore: stage hash-pinned r13 and compatibility import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and import the bounded source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse','HEAD^') == 'c40923a446547c1a41485c9256bb29db0c69b9fc'
          own = '.github/workflows/import-verified-r13.yml'
          assert git('diff','--name-only','HEAD^','HEAD').splitlines() == [own]
          encoded = '''
          
          
          
          '''
          raw = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '64551f3547568829440f73e74a3bfa73024d9b5d631ad14cfe135ce2d88e03db'
          data = json.loads(raw)
          assert data['base_commit'] == git('rev-parse','HEAD^')
          paths = {f['path'] for f in data['files']}
          assert len(paths) == 15
          for f in data['files']:
              p = pathlib.PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts and (str(p).startswith('cad_photo_to_dxf/') or str(p)=='pytest.ini')
              before = f['before_git_blob']
              if before:
                  assert git('rev-parse', 'HEAD:'+str(p)) == before, str(p)
              else:
                  assert not pathlib.Path(p).exists(), str(p)
          patch = pathlib.Path('/tmp/verified-r13.patch')
          patch.write_text(data['patch'], encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)], check=True)
          subprocess.run(['git','apply','--index',str(patch)], check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == paths
          for f in data['files']:
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest() == f['after_sha256'], f['path']
          subprocess.run(['git','rm',own], check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','sync: import locally accepted r13 and tested compatibility fixes'], check=True)
          subprocess.run(['git','push','origin','HEAD:sync/verified-online-r12-20261116'], check=True)
          PY
