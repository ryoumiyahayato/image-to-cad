name: Execute verified r13 source import
on:
  push:
    branches:
      - sync/verified-online-r12-20261116
    paths:
      - .github/workflows/run-verified-r13-import.yml
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/sync/verified-online-r12-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Execute bounded and hash-checked source integration
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == 'e50f95dcea78d589af1f191e82d2901fabbad2c7'
          payload = '.github/workflows/apply-verified-r13-delta.yml'
          assert git('rev-parse', 'HEAD:'+payload) == '788e9a3e7dd704e9afac0ceb9ffc94f79f455cbc'
          lines = pathlib.Path(payload).read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          assert all(not line or line.startswith('          ') for line in lines[start:end])
          script = '\n'.join(line[10:] for line in lines[start:end]) + '\n'
          before = "git('rev-parse', 'HEAD^') == '82b82de780fe60090b3921794ead608b2fe02d1f'"
          assert script.count(before) == 1
          script = script.replace(before, "git('rev-parse', 'HEAD~2') == '82b82de780fe60090b3921794ead608b2fe02d1f'")
          before = "== '.github/workflows/apply-verified-r13-delta.yml'"
          assert script.count(before) == 1
          script = script.replace(before, "== '.github/workflows/run-verified-r13-import.yml'")
          compile(script, '<verified-source-import>', 'exec')
          exec(script, {'__name__': '__main__'})
          PY
